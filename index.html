<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Happy Birthday - Fireworks Show</title>
<style>
  :root{
    --bg:#001428;
    --panel: rgba(255,255,255,0.05);
    --glass: rgba(255,255,255,0.06);
    --accent: #ffd166;
  }
  html,body{ height:100%; margin:0; font-family: Inter, system-ui, Arial; background: radial-gradient(ellipse at 20% 10%, rgba(255,200,120,0.04), transparent 5%), var(--bg); color:#fff; overflow:hidden;}
  .center-panel{
    position: absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:50;
  }
  .card{
    width: min(680px, 94%); padding: 24px; background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02)); border-radius:16px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); backdrop-filter: blur(6px);
  }
  h1{ margin:0 0 8px 0; font-size:1.4rem; letter-spacing:0.6px;}
  label{ display:block; font-size:0.9rem; margin-top:12px; color:#dfefff; }
  input[type="text"], input[type="date"]{
    width:100%; padding:10px 12px; margin-top:6px; border-radius:8px; border:1px solid rgba(255,255,255,0.06); background: rgba(255,255,255,0.02); color:#fff; font-size:1rem;
  }
  .controls{ display:flex; gap:8px; margin-top:16px; align-items:center; }
  button, .mutebtn{ background:linear-gradient(90deg,#ff7ab6,#ffd166); color:#111; border: none; padding:10px 14px; border-radius:10px; cursor:pointer; font-weight:600;}
  button.secondary{ background: transparent; border:1px solid rgba(255,255,255,0.07); color:#dfefff; }
  .small{ font-size:0.85rem; color:#bcd9ff; margin-top:8px; }
  #overlayForm{ z-index:60; }
  /* Fullscreen container for canvas and UI */
  #stage{ position:fixed; inset:0; z-index:10; pointer-events:none; }
  canvas{ display:block; width:100%; height:100%; }
  .ui-top{
    position:fixed; top:12px; left:12px; z-index:70; display:flex; gap:8px; align-items:center;
  }
  .ui-top button{ pointer-events:auto; }
  .messageBox{
    position:fixed; bottom:8%; left:50%; transform:translateX(-50%); z-index:70; pointer-events:none;
    text-align:center;
  }
  .message{
    font-weight:800; font-size:3.2rem; letter-spacing:1px; text-shadow: 0 10px 40px rgba(0,0,0,0.6);
    transform-origin:center center;
    opacity:0; color: #ffefc1;
  }
  /* slow motion reveal */
  .message.show{
    animation: revealSlow 8s ease forwards;
  }
  @keyframes revealSlow{
    0%{ transform: translateY(30px) scale(0.9); opacity:0; filter: blur(4px) }
    20%{ transform: translateY(0) scale(1.05); opacity:1; filter: blur(0px) }
    100%{ transform: scale(1); opacity:1; filter: blur(0); }
  }
  .sub{
    font-size:1.1rem; color:#dbe7ff; margin-top:8px; opacity:0.9;
  }
  /* small footer instructions */
  .hint{ position:fixed; right:12px; bottom:12px; z-index:70; font-size:0.9rem; color:#a8d0ff; }
  /* responsive tweaks */
  @media (max-width:520px){
    .message{ font-size:2rem; }
    .card{ padding:16px; }
  }
</style>
</head>
<body>

<!-- Input overlay -->
<div id="overlayForm" class="center-panel">
  <div class="card" role="dialog" aria-labelledby="title" aria-modal="true">
    <h1 id="title">Set up the Surprise</h1>
    <p class="small">Enter her name and date of birth. Tap <strong>Start Show</strong> to launch the crackers and the full birthday message in slow motion.</p>

    <label for="name">Her name</label>
    <input id="name" type="text" placeholder="e.g. Ananya" required />

    <label for="dob">Date of birth</label>
    <input id="dob" type="date" />

    <div class="controls">
      <button id="startBtn">Start Show</button>
      <button id="demoBtn" class="secondary">Demo (skip date)</button>
      <div style="flex:1"></div>
      <button id="muteBtn" class="mutebtn" title="Mute/unmute sound">🔊 Mute</button>
    </div>
    <p class="small">Tip: On mobile, use headphones for better blast sound. You can pause or mute using the top-left controls during the show.</p>
  </div>
</div>

<!-- Top UI -->
<div class="ui-top" aria-hidden="false">
  <button id="pauseBtn" class="secondary" style="pointer-events:none">Pause</button>
  <button id="restartBtn" class="secondary" style="pointer-events:none">Restart</button>
</div>

<!-- Canvas stage -->
<div id="stage" aria-hidden="true">
  <canvas id="canvas"></canvas>
</div>

<!-- Slow-motion message -->
<div class="messageBox" id="messageBox" aria-hidden="true">
  <div id="message" class="message"></div>
  <div id="subtext" class="sub"></div>
</div>

<div class="hint">Click anywhere to add extra crackers</div>

<script>
/*******************************
 * Fireworks + Sound Show
 * Single-file: HTML/CSS/JS
 *******************************/

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { alpha: true });
let W = canvas.width = innerWidth;
let H = canvas.height = innerHeight;

window.addEventListener('resize', () => {
  W = canvas.width = innerWidth;
  H = canvas.height = innerHeight;
});

/* ---------- Controls & UI ---------- */
const overlay = document.getElementById('overlayForm');
const nameInput = document.getElementById('name');
const dobInput = document.getElementById('dob');
const startBtn = document.getElementById('startBtn');
const demoBtn = document.getElementById('demoBtn');
const muteBtn = document.getElementById('muteBtn');
const pauseBtn = document.getElementById('pauseBtn');
const restartBtn = document.getElementById('restartBtn');
const messageEl = document.getElementById('message');
const subtext = document.getElementById('subtext');
const messageBox = document.getElementById('messageBox');

let isMuted = false;
let isPaused = false;

/* ---------- Audio: WebAudio explosion/noise ---------- */
let AudioCtx = null;
function ensureAudioCtx(){
  if(!AudioCtx){
    AudioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}
function playExplosion(time = 0, volume=0.6){
  if(isMuted) return;
  ensureAudioCtx();
  const ctxA = AudioCtx;
  const now = time ? ctxA.currentTime + time : ctxA.currentTime;

  // Create a short noise burst
  const bufferSize = ctxA.sampleRate * 1.0; // 1 sec buffer
  const buffer = ctxA.createBuffer(1, bufferSize, ctxA.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++){
    // pink-ish decay noise: random * envelope
    data[i] = (Math.random()*2 - 1) * Math.exp(-4 * i / bufferSize);
  }
  const noise = ctxA.createBufferSource();
  noise.buffer = buffer;

  // Filter and gain to shape the blast
  const filter = ctxA.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 1200 + Math.random()*2000;

  const gain = ctxA.createGain();
  gain.gain.value = volume;

  // Optional harmonic "boom" using oscillator
  const osc = ctxA.createOscillator();
  osc.type = 'sine';
  osc.frequency.value = 120 + Math.random()*260;
  const oscGain = ctxA.createGain();
  oscGain.gain.value = 0.12;

  // Connect nodes
  noise.connect(filter);
  filter.connect(gain);
  gain.connect(ctxA.destination);

  osc.connect(oscGain);
  oscGain.connect(ctxA.destination);

  noise.start(now);
  osc.start(now);

  // small pitch/drop for realism
  osc.frequency.setValueAtTime(osc.frequency.value, now);
  osc.frequency.exponentialRampToValueAtTime(40 + Math.random()*30, now + 0.35);

  // Envelope fade
  gain.gain.setValueAtTime(volume, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);

  oscGain.gain.setValueAtTime(0.12, now);
  oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);

  // stop
  noise.stop(now + 1.0);
  osc.stop(now + 1.0);
}

/* ---------- Fireworks particle system ---------- */
const particles = [];
const rockets = [];
const GRAVITY = 0.06;
const FIREWORK_FREQUENCY = 900; // ms average between automatic launches

function random(min, max){ return Math.random()*(max-min)+min; }

class Rocket{
  constructor(x, y, vx, vy, color){
    this.x = x; this.y = y; this.vx = vx; this.vy = vy; this.color = color;
    this.trail = []; this.alive = true;
  }
  update(){
    this.trail.push({x:this.x, y:this.y});
    if(this.trail.length>12) this.trail.shift();
    this.vy += GRAVITY * 0.08;
    this.x += this.vx;
    this.y += this.vy;
    // explode if vy > -1 or reached a ceiling
    if(this.vy > -1 || this.y < H*0.2 || Math.random() < 0.002){
      this.explode();
      this.alive = false;
    }
  }
  explode(){
    const count = Math.floor(random(28, 120));
    const hue = this.color;
    for(let i=0;i<count;i++){
      const angle = Math.random()*Math.PI*2;
      const speed = random(1, 6) * (0.5 + Math.random()*0.9);
      const p = new Particle(this.x, this.y, Math.cos(angle)*speed, Math.sin(angle)*speed, hue, false);
      particles.push(p);
    }
    // add some sparkles / moving objects after explosion
    for(let i=0;i<12;i++){
      particles.push(new Particle(this.x, this.y, random(-1.5,1.5), random(-3,-0.4), hue, true, true));
    }
    // play explosion sound
    playExplosion();
  }
  draw(ctx){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.beginPath();
    ctx.fillStyle = hsl(${this.color}, 90%, 60%);
    ctx.arc(this.x, this.y, 3.5, 0, Math.PI*2);
    ctx.fill();
    // trail
    ctx.strokeStyle = rgba(255,255,255,0.06);
    ctx.lineWidth = 1;
    ctx.beginPath();
    for(let i=0;i<this.trail.length;i++){
      const t = this.trail[i];
      if(i===0) ctx.moveTo(t.x, t.y);
      else ctx.lineTo(t.x, t.y);
    }
    ctx.stroke();
    ctx.restore();
  }
}

class Particle{
  constructor(x,y,vx,vy,hue, spark=false, glitter=false){
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.hue = hue;
    this.alpha = 1;
    this.size = spark ? random(1,2.5) : random(1.6,3.6);
    this.decay = random(0.008, 0.02);
    this.spark = spark;
    this.glitter = glitter;
    this.age = 0;
  }
  update(){
    this.vy += GRAVITY * (this.spark ? 0.6 : 1);
    this.vx *= 0.995;
    this.vy *= 0.995;
    this.x += this.vx;
    this.y += this.vy;
    this.alpha -= this.decay;
    this.age++;
    if(this.alpha <= 0) this.alpha = 0;
    // trailing glitter spawns
    if(this.glitter && Math.random() < 0.06){
      particles.push(new Particle(this.x, this.y, random(-0.6,0.6), random(-0.6,0.6), this.hue, true, false));
    }
  }
  draw(ctx){
    if(this.alpha <= 0) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    // glow
    const grade = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size*6);
    grade.addColorStop(0, rgba(255,255,255,${Math.min(0.9, this.alpha*0.9)}));
    grade.addColorStop(0.2, hsla(${this.hue}, 90%, 60%, ${this.alpha*0.9}));
    grade.addColorStop(1, rgba(0,0,0,0));
    ctx.fillStyle = grade;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size*3, 0, Math.PI*2);
    ctx.fill();

    // spark center
    ctx.beginPath();
    ctx.fillStyle = hsla(${this.hue}, 90%, 60%, ${this.alpha});
    ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
    ctx.fill();

    // thin tail for sparks
    if(this.spark){
      ctx.strokeStyle = hsla(${this.hue}, 90%, 60%, ${this.alpha*0.9});
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(this.x, this.y);
      ctx.lineTo(this.x - this.vx*2, this.y - this.vy*2);
      ctx.stroke();
    }
    ctx.restore();
  }
}

/* ---------- Animation loop ---------- */
let lastTime = 0;
let lastAuto = 0;
let raf = null;

function loop(ts){
  if(isPaused){ raf = requestAnimationFrame(loop); return; }
  const delta = ts - lastTime;
  lastTime = ts;

  // translucent background to keep trails
  ctx.fillStyle = 'rgba(0,10,20,0.22)';
  ctx.fillRect(0,0,W,H);

  // occasionally launch rockets automatically
  if(ts - lastAuto > FIREWORK_FREQUENCY * (0.6 + Math.random()*1.4)){
    spawnAutoRocket();
    lastAuto = ts;
  }

  // update rockets
  for(let i=rockets.length-1;i>=0;i--){
    const r = rockets[i];
    r.update();
    r.draw(ctx);
    if(!r.alive) rockets.splice(i,1);
  }

  // update particles
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.update();
    p.draw(ctx);
    if(p.alpha <= 0.005 || p.y > H + 50) particles.splice(i,1);
  }

  raf = requestAnimationFrame(loop);
}

/* ---------- Interaction: clicks create rockets ---------- */
window.addEventListener('pointerdown', (e) => {
  // if overlay visible, ignore here
  if(overlay.style.display !== 'none') return;
  spawnRocket(e.clientX, H, random(-1.5,1.5), random(-9,-14), random(0,360));
});

/* ---------- Spawning helpers ---------- */
function spawnRocket(x= random(W*0.1, W*0.9), y = H, vx=random(-1.2,1.2), vy=random(-11,-15), color=null){
  const hue = color || Math.floor(random(0, 360));
  const r = new Rocket(x, y, vx, vy, hue);
  rockets.push(r);
  // small whoosh sound
  if(!isMuted){
    ensureAudioCtx();
    const ac = AudioCtx;
    const g = ac.createGain(); g.gain.value = 0.05;
    const o = ac.createOscillator(); o.type = 'sawtooth';
    o.frequency.value = 450 + Math.random()*220;
    o.connect(g); g.connect(ac.destination);
    o.start();
    o.frequency.exponentialRampToValueAtTime(120, ac.currentTime + 0.6);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.7);
    o.stop(ac.currentTime + 0.7);
  }
}

function spawnAutoRocket(){
  // launch from bottom center horizontally random
  spawnRocket(random(W*0.15, W*0.85), H, random(-1.0,1.0), random(-13,-8), Math.floor(random(20,360)));
  // small scheduled additional blasts sometimes
  if(Math.random() < 0.25){
    setTimeout(()=> playExplosion(0), 250);
  }
}

/* ---------- Start / Demo / Form logic ---------- */
function startShow(){
  const herName = (nameInput.value || "You").trim();
  const dob = (dobInput.value || "").trim();
  overlay.style.display = 'none';
  document.getElementById('stage').style.pointerEvents = 'auto';
  document.getElementById('stage').ariaHidden = 'false';
  document.getElementById('overlayForm').ariaHidden = 'true';
  // enable top controls
  pauseBtn.style.pointerEvents = 'auto';
  restartBtn.style.pointerEvents = 'auto';

  // show message in slow motion after a delay
  setTimeout(()=> {
    showMessage(herName, dob);
  }, 2400);

  // start engine
  if(!raf) {
    lastTime = performance.now();
    lastAuto = performance.now() - 1200;
    raf = requestAnimationFrame(loop);
  }
}

startBtn.addEventListener('click', (e) => {
  // ensure user allowed audio
  ensureAudioCtx();
  if(!nameInput.value.trim()){
    // gentle refusal and proceed with default
    nameInput.value = "Darling";
  }
  startShow();
});

demoBtn.addEventListener('click', () => {
  nameInput.value = "Lovely";
  dobInput.value = "";
  startShow();
});

muteBtn.addEventListener('click', () => {
  isMuted = !isMuted;
  muteBtn.textContent = isMuted ? "🔇 Muted" : "🔊 Mute";
});

pauseBtn.addEventListener('click', () => {
  isPaused = !isPaused;
  pauseBtn.textContent = isPaused ? "Resume" : "Pause";
  if(!isPaused && !raf){ raf = requestAnimationFrame(loop); }
});

restartBtn.addEventListener('click', () => {
  // clear and reset
  particles.length = 0; rockets.length = 0;
  ctx.clearRect(0,0,W,H);
  // relaunch a few
  for(let i=0;i<5;i++) setTimeout(spawnAutoRocket, i*180);
  // re-show message gradually
  messageEl.classList.remove('show');
  setTimeout(()=> { messageEl.classList.add('show') }, 200);
});

/* ---------- Slow motion birthday message ---------- */
function showMessage(name, dob){
  messageEl.style.opacity = 0;
  messageEl.textContent = Happy Birthday, ${name}!;
  const dobText = dob ? Born on ${new Date(dob).toLocaleDateString()} : '';
  subtext.textContent = dobText;
  messageBox.style.pointerEvents = 'none';
  messageBox.ariaHidden = 'false';
  // play gentle music-like tube using oscillator as background for message
  if(!isMuted){
    ensureAudioCtx();
    const ac = AudioCtx;
    const osc = ac.createOscillator();
    const g = ac.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(120, ac.currentTime);
    g.gain.value = 0.0001;
    osc.connect(g); g.connect(ac.destination);
    // slow swell
    g.gain.linearRampToValueAtTime(0.028, ac.currentTime + 2.0);
    osc.start();
    g.gain.exponentialRampToValueAtTime(0.00001, ac.currentTime + 8.5);
    osc.stop(ac.currentTime + 9);
  }

  // show text with class that triggers slow motion reveal
  messageEl.classList.remove('show');
  void messageEl.offsetWidth;
  messageEl.classList.add('show');

  // schedule a few large, slow fireworks synchronized with message
  setTimeout(()=> spawnBigDisplay(), 600);
  setTimeout(()=> spawnBigDisplay(), 1800);
  setTimeout(()=> spawnBigDisplay(), 3200);
}

/* Big display: multiple simultaneous rockets that explode into many particles */
function spawnBigDisplay(){
  const center = W * (0.4 + Math.random()*0.2);
  for(let i=0;i<6;i++){
    setTimeout(()=> spawnRocket(center + random(-120,120), H, random(-2,2), random(-12,-16), Math.floor(random(0,360))), i*80);
  }
  // deeper boom
  playExplosion(0, 1.0);
}

/* ---------- Initialization visuals & gentle ambient lighting ---------- */
// draw a subtle skyline silhouette
function drawSkyline(){
  const horizon = H*0.68;
  ctx.save();
  // water reflection base
  ctx.fillStyle = 'rgba(0,8,14,0.5)';
  ctx.fillRect(0, horizon, W, H - horizon);
  // faux buildings rectangles
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  for(let i=0;i<18;i++){
    const bw = random(30, 90);
    const bh = random(40, 150);
    const x = i * (W / 18) + random(-20, 20);
    const y = horizon - bh;
    ctx.fillRect(x, y, bw, bh);
    // windows
    for(let wx = x+6; wx < x + bw - 6; wx += 10){
      if(Math.random() < 0.4) ctx.fillStyle='rgba(255,215,120,0.06)';
      else ctx.fillStyle='rgba(255,215,120,0.01)';
      ctx.fillRect(wx, y + 8 + Math.random()*bh*0.8, 6, 5);
    }
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
  }
  // calm reflection line
  ctx.restore();
}
drawSkyline();

// boot initial small rockets for visual interest
for(let i=0;i<3;i++) setTimeout(spawnAutoRocket, i*300);

/* Accessibility: focus the name input */
nameInput.focus();

/* Safety: warn if audio context resumed needed on Chrome Mobile */
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && AudioCtx && AudioCtx.state === 'suspended'){
    AudioCtx.resume().catch(()=>{});
  }
});

</script>
</body>
</html>
